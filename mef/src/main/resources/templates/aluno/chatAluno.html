<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat - Mente em Foco</title>
	<link rel="stylesheet" th:href="@{/css/chatAluno.css}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">
	<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

	<div class="app-layout">
		<!-- SIDEBAR DO ALUNO -->
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img th:src="@{/img/logo_em_pe.svg}" alt="Mente em Foco" class="logo-symbol-only">
				<img th:src="@{/img/logo_em_pe.svg}" alt="Mente em Foco" class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-left"></i>
			</div>

			<nav class="sidebar-nav">
				<a th:href="@{/aluno/dashboard}" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a th:href="@{/aluno/tarefas}" class="nav-link">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a th:href="@{/aluno/chat}" class="nav-link active">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="#" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
			</nav>

			<div class="sidebar-footer">
				<a th:href="@{/aluno/configuracoes}" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<form th:action="@{/logout}" method="post" style="display:contents;">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button type="submit" class="nav-link" id="btn-open-logout">
						<i data-lucide="log-out"></i>
						<span class="nav-title">Sair</span>
					</button>
				</form>
			</div>
		</aside>

		<!-- CHAT CONTAINER -->
		<div class="chat-container">
			<div class="chat-sidebar">
				<div class="chat-sidebar-header">
					<h2 class="chat-sidebar-title">Chat</h2>
					<i data-lucide="edit-3" style="color: #0F2D3C; cursor: pointer; width:20px; height:20px;"></i>
				</div>

				<div class="contacts-list" id="contacts-list">
					
					<!-- Listagem dinâmica dos contatos/professores vinda do backend -->
					<div class="contact-item" th:each="professor : ${professores}"
						th:data-id="${professor.id}"
						th:data-nome="${professor.nome}"
						onclick="selectContact(this)">

						<div class="avatar-box">
							<i data-lucide="user"></i>
						</div>

						<div class="contact-info">
							<span class="contact-name" th:text="${professor.nome}"></span>
						</div>

					</div>

				</div>
			</div>

			<div class="chat-main">
				<div class="chat-main-header">
					<div class="active-user-info">
						<div class="avatar-box" style="width:38px; height:38px; border:none;" id="active-avatar-box">
							<i data-lucide="user"></i>
						</div>
						<div>
							<span class="active-contact-title" id="active-contact-name">Selecione um contato</span>
							<span class="active-status" id="active-contact-status">Online agora</span>
						</div>
					</div>
				</div>

				<div class="messages-wrapper" id="messages-wrapper"></div>

				<div class="chat-input-bar">
					<div class="input-group">
						<button class="btn-plus-attach" title="Anexar arquivo ou imagem">
							<i data-lucide="plus"></i>
						</button>
						<input type="text" class="chat-text-input" id="chat-input" placeholder="Mensagem..."
							onkeypress="handleKeyPress(event)">
						<button class="btn-send-msg" onclick="sendMessage()" title="Enviar mensagem">
							<i data-lucide="send"></i>
						</button>
					</div>
				</div>
			</div>

		</div>

	</div>

	<!-- SCRIPTS DE WEBSOCKET E LÓGICA -->
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

	<script th:inline="javascript">

		lucide.createIcons();

		// =====================================================
		// USUÁRIO LOGADO (Injetado pelo Spring Boot)
		// =====================================================
		const usuarioLogadoId = /*[[${usuarioLogadoId}]]*/ null;
		let usuarioSelecionadoId = null;

		// =====================================================
		// WEBSOCKET
		// =====================================================
		const stompClient = new StompJs.Client({
		    webSocketFactory: () => new SockJS('/ws'),
		    reconnectDelay: 5000,
		    onConnect: () => {
		        console.log('WebSocket conectado!');
		        
		        // MUDANÇA AQUI: Trocamos '/user/queue/messages' 
		        // por '/queue/messages/' + usuarioLogadoId
		        stompClient.subscribe(
		            '/queue/messages/' + usuarioLogadoId,
		            function (message) {
		                const mensagem = JSON.parse(message.body);
		                console.log('Mensagem recebida:', mensagem);
		                receberMensagem(mensagem);
		            }
		        );
		    },
		    onStompError: (frame) => {
		        console.error('Erro STOMP:', frame);
		    },
		    onWebSocketError: (error) => {
		        console.error('Erro WebSocket:', error);
		    }
		});

		stompClient.activate();

		// =====================================================
		// SIDEBAR
		// =====================================================
		const sidebar = document.getElementById('sidebar');
		const toggleBtn = document.getElementById('toggle-btn');
		toggleBtn.addEventListener('click', () => {
			sidebar.classList.toggle('expanded');
		});

		// =====================================================
		// SELECIONAR CONTATO
		// =====================================================
		function selectContact(element) {
			document.querySelectorAll('.contact-item').forEach(item => {
				item.classList.remove('active');
			});

			element.classList.add('active');

			usuarioSelecionadoId = element.dataset.id;
			const nome = element.dataset.nome;

			document.getElementById('active-contact-name').textContent = nome;

			carregarConversa(usuarioSelecionadoId);
		}

		// =====================================================
		// CARREGAR HISTÓRICO
		// =====================================================
		async function carregarConversa(idUsuario) {
			try {
				const response = await fetch(`/aluno/chat/historico/${idUsuario}`);
				if (!response.ok) {
					throw new Error('Erro ao carregar conversa');
				}
				const mensagens = await response.json();
				renderMessages(mensagens);
			} catch (error) {
				console.error('Erro ao carregar conversa:', error);
			}
		}

		// =====================================================
		// RENDERIZAR MENSAGENS
		// =====================================================
		function renderMessages(mensagens) {
			const wrapper = document.getElementById('messages-wrapper');
			wrapper.innerHTML = '';

			mensagens.forEach(mensagem => {
				adicionarMensagemNaTela(mensagem);
			});

			wrapper.scrollTop = wrapper.scrollHeight;
		}

		function adicionarMensagemNaTela(mensagem) {
			const wrapper = document.getElementById('messages-wrapper');
			const souEu = String(mensagem.sender) === String(usuarioLogadoId);

			const msgRow = document.createElement('div');
			msgRow.className = `message-row ${souEu ? 'sent' : 'received'}`;

			const data = new Date(mensagem.timestamp);
			const hora = data.toLocaleTimeString('pt-BR', {
				hour: '2-digit',
				minute: '2-digit'
			});

			if (souEu) {
				msgRow.innerHTML = `
					<div class="message-bubble">
						<span>${escapeHTML(mensagem.content)}</span>
						<div class="message-meta">
							<span>${hora}</span>
							<i data-lucide="check-check" class="read-check"></i>
						</div>
					</div>
				`;
			} else {
				msgRow.innerHTML = `
					<div class="avatar-box" style="width:36px; height:36px; border:none;">
						<i data-lucide="user"></i>
					</div>
					<div class="message-bubble">
						<span>${escapeHTML(mensagem.content)}</span>
						<div class="message-meta" style="color:#557D91;">${hora}</div>
					</div>
				`;
			}

			wrapper.appendChild(msgRow);
			lucide.createIcons();
			wrapper.scrollTop = wrapper.scrollHeight;
		}

		// =====================================================
		// RECEBER MENSAGEM VIA WEBSOCKET
		// =====================================================
		function receberMensagem(mensagem) {
			const conversaAtual = String(usuarioSelecionadoId);
			const pertenceAConversa =
				String(mensagem.sender) === conversaAtual ||
				String(mensagem.recipient) === conversaAtual;

			if (pertenceAConversa) {
				adicionarMensagemNaTela(mensagem);
			} else {
				console.log('Mensagem de outra conversa:', mensagem);
			}
		}


		function sendMessage() {
			const input = document.getElementById('chat-input');
			const messageText = input.value.trim();

			if (messageText === '') {
				return;
			}

			if (!usuarioSelecionadoId) {
				console.warn('Nenhum contato selecionado.');
				return;
			}

			if (!stompClient.connected) {
				console.warn('WebSocket não está conectado.');
				return;
			}

			const mensagem = {
				sender: String(usuarioLogadoId),
				recipient: String(usuarioSelecionadoId),
				content: messageText,
				timestamp: new Date().toISOString()
			};

			stompClient.publish({
				destination: '/app/chat.privateMessage',
				body: JSON.stringify(mensagem)
			});

			adicionarMensagemNaTela(mensagem);
			input.value = '';
		}

		function handleKeyPress(e) {
			if (e.key === 'Enter') {
				sendMessage();
			}
		}


		function escapeHTML(str) {
			return str.replace(/[&<>'"]/g, tag => ({
				'&': '&amp;',
				'<': '&lt;',
				'>': '&gt;',
				"'": '&#39;',
				'"': '&quot;'
			}[tag] || tag));
		}

		document.addEventListener('DOMContentLoaded', () => {
			const primeiroContato = document.querySelector('.contact-item');
			if (primeiroContato) {
				selectContact(primeiroContato);
			}
		});

	</script>

</body>

</html>
