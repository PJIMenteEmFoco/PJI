<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mente em Foco</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        <section class="brand-section">
            <img th:src="@{/img/logo_em_pe.svg}" alt="Logo do mente em foco" class="brand-logo">
        </section>

        <section class="form-section">
            <form th:action="@{/login}" method="POST" class="login-form">
                
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="username" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="password" required>
                </div>

                <a th:href="@{#}" class="forgot-password">Esqueceu a senha? Clique aqui!</a>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a th:href="@{/cadastro}" class="btn btn-secondary">Cadastrar-se</a>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
