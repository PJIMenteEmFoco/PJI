<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Turmas - Mente em Foco</title>

	<!-- CSS usado pela versão visual que já estava funcionando -->
	<link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
	<link rel="stylesheet" href="/css/turmas-professor.css" th:href="@{/css/turmas-professor.css}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">

	<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

	<!-- Formulário de logout usado pelo Spring Security -->
	<form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;">
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	</form>

	<div class="app-layout">

		<!-- SIDEBAR -->
		<aside class="sidebar" id="sidebar">

			<div class="sidebar-header">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-symbol-only">

				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-right"></i>
			</div>

			<nav class="sidebar-nav">

				<a href="/professor/dashboard" th:href="@{/professor/dashboard}" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>

				<a href="/professor/tarefas" th:href="@{/professor/tarefas}" class="nav-link">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>

				<a href="/professor/chat" th:href="@{/professor/chat}" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>

				<a href="/professor/calendario" th:href="@{/professor/calendario}" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>

				<a href="/professor/turmas" th:href="@{/professor/turmas}" class="nav-link active">
					<i data-lucide="users"></i>
					<span class="nav-title">Turmas</span>
				</a>

			</nav>

			<div class="sidebar-footer">

				<a href="/professor/configuracoes" th:href="@{/professor/configuracoes}" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>

				<button type="button" class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>

			</div>

		</aside>

		<!-- CONTEÚDO PRINCIPAL -->
		<main class="main-content">

			<div class="page-container">

				<h1 class="page-title">Turmas</h1>

				<!-- BARRA DE AÇÕES -->
				<div class="toolbar-row">

					<button type="button" class="btn-criar-turma"
						th:onclick="|window.location.href='@{/professor/turmas/nova}'|">
						<i data-lucide="plus"></i>
						Criar turma
					</button>

					<div class="filters-group">

						<div class="search-box">
							<i data-lucide="search" style="width: 16px; height: 16px; color: #8fa5b4;"></i>

							<input type="text" id="input-search-turmas" placeholder="Pesquisar turmas..."
								autocomplete="off">
						</div>

						<select class="select-filter" id="select-filter-psico">

							<option value="">
								Todos os Psicopedagogos
							</option>

							<option th:each="psicopedagogo : ${psicopedagogos}" th:value="${psicopedagogo.id}"
								th:text="${psicopedagogo.nome}">
								Psicopedagogo
							</option>

						</select>

					</div>

				</div>

				<h2 class="section-title">Turmas</h2>

				<!-- GRID DINÂMICO -->
				<div class="turmas-grid" id="turmas-grid">

					<div class="turma-card" th:each="turma : ${turmas}"
						th:onclick="|window.location.href='/professor/turmas/${turma.id}'|">

						<h3 class="turma-card-title" th:text="${turma.nome}">
							Turma
						</h3>

						<div class="avatars-and-badge">

							<div class="avatar-group">

								<!-- Mostra no máximo os três primeiros ALUNOS -->
								<th:block th:each="aluno, iterStat : ${turma.usuarios.?[perfil == 'ALUNO']}"
									th:if="${iterStat.index < 3}">

									<div class="avatar-circle" th:text="${aluno.nome != null and !#strings.isEmpty(aluno.nome)
                                             ? #strings.substring(aluno.nome, 0, 1).toUpperCase()
                                             : '?'}">
										A
									</div>

								</th:block>

								<!-- Caso a turma não tenha alunos -->
								<div class="avatar-circle"
									th:if="${#lists.isEmpty(turma.usuarios.?[perfil == 'ALUNO'])}">
									--
								</div>

							</div>

							<span class="badge-alunos">
								<i data-lucide="users" style="width:14px; height:14px;"></i>

								<span th:text="${#lists.size(turma.usuarios.?[perfil == 'ALUNO'])} + ' Alunos'">
									0 Alunos
								</span>
							</span>

						</div>

						<div class="turma-info-text">

							<div>
								Professor:

								<strong th:each="usuario : ${turma.usuarios}" th:if="${usuario.perfil == 'PROFESSOR'}"
									th:text="${usuario.nome}">
									Professor
								</strong>

								<strong th:if="${#lists.isEmpty(turma.usuarios.?[perfil == 'PROFESSOR'])}">
									Não informado
								</strong>
							</div>

							<div>
								Psicopedagogo:

								<strong class="psicopedagogo" th:each="usuario : ${turma.usuarios}"
									th:if="${usuario.perfil == 'PSICOPEDAGOGO'}"
									th:attr="data-psicopedagogo-id=${usuario.id}" th:text="${usuario.nome}">
									Psicopedagogo
								</strong>

								<strong th:if="${#lists.isEmpty(turma.usuarios.?[perfil == 'PSICOPEDAGOGO'])}">
									Não informado
								</strong>
							</div>

						</div>

					</div>

					<!-- Nenhuma turma cadastrada -->
					<div class="empty-teams-message" id="empty-teams-message"
						th:if="${turmas == null or #lists.isEmpty(turmas)}">
						<i data-lucide="users"></i>
						<p>Você ainda não possui nenhuma turma.</p>
					</div>

					<!-- Nenhum resultado após pesquisa/filtro -->
					<div class="empty-teams-message" id="no-results-message" style="display: none;">
						<i data-lucide="search-x"></i>
						<p>Nenhuma turma encontrada.</p>
					</div>

				</div>

			</div>

		</main>

	</div>

	<!-- MODAL DE LOGOUT -->
	<div class="modal-overlay" id="logout-modal">

		<div class="modal-card-logout">

			<h3 class="modal-logout-title">
				Tem certeza que deseja sair da sua conta?
			</h3>

			<div class="modal-logout-actions">

				<button type="button" class="btn-logout-cancel" id="btn-cancel-logout">
					Cancelar
				</button>

				<button type="button" class="btn-logout-confirm" id="btn-confirm-logout">
					Sair
				</button>

			</div>

		</div>

	</div>

	<script>

		/*
		 * TEMA
		 */
		(function initTheme() {
			if (localStorage.getItem('theme') === 'escuro') {
				document.body.classList.add('dark-mode');
			}
		})();


		/*
		 * LUCIDE
		 */
		lucide.createIcons();


		/*
		 * SIDEBAR
		 */
		const sidebar =
			document.getElementById('sidebar');

		const toggleBtn =
			document.getElementById('toggle-btn');

		if (sidebar && toggleBtn) {
			toggleBtn.addEventListener('click', () => {
				sidebar.classList.toggle('expanded');
			});
		}


		/*
		 * PESQUISA E FILTRO
		 *
		 * Os cards já vieram renderizados do banco pelo Thymeleaf.
		 * O JavaScript apenas decide quais cards ficam visíveis.
		 */
		const searchInput =
			document.getElementById('input-search-turmas');

		const filterPsico =
			document.getElementById('select-filter-psico');

		const teamCards =
			document.querySelectorAll('.turma-card');

		const noResultsMessage =
			document.getElementById('no-results-message');


		function filtrarTurmas() {

			const pesquisa =
				(searchInput?.value || '')
					.trim()
					.toLocaleLowerCase('pt-BR');

			const psicopedagogoSelecionado =
				filterPsico?.value || '';

			let turmasVisiveis = 0;


			teamCards.forEach(card => {

				/*
				 * Pesquisar em todo o texto do card:
				 * nome da turma, professor e psicopedagogo.
				 */
				const textoCard =
					card.textContent
						.toLocaleLowerCase('pt-BR');


				/*
				 * Cada psicopedagogo renderizado recebe
				 * data-psicopedagogo-id com o ID vindo do banco.
				 */
				const psicopedagogos =
					card.querySelectorAll('.psicopedagogo');


				const correspondePsicopedagogo =
					psicopedagogoSelecionado === '' ||
					Array.from(psicopedagogos).some(
						psicopedagogo =>
							psicopedagogo.dataset.psicopedagogoId ===
							psicopedagogoSelecionado
					);


				const correspondePesquisa =
					textoCard.includes(pesquisa);


				const deveExibir =
					correspondePesquisa &&
					correspondePsicopedagogo;


				card.style.display =
					deveExibir ? '' : 'none';


				if (deveExibir) {
					turmasVisiveis++;
				}

			});


			/*
			 * Não mostra esta mensagem se o professor
			 * realmente não possuir nenhuma turma.
			 * Nesse caso o Thymeleaf já mostra a mensagem
			 * "Você ainda não possui nenhuma turma".
			 */
			if (noResultsMessage) {

				noResultsMessage.style.display =
					teamCards.length > 0 &&
						turmasVisiveis === 0
						? 'flex'
						: 'none';
			}
		}


		if (searchInput) {
			searchInput.addEventListener(
				'input',
				filtrarTurmas
			);
		}


		if (filterPsico) {
			filterPsico.addEventListener(
				'change',
				filtrarTurmas
			);
		}


		/*
		 * LOGOUT
		 */
		const logoutModal =
			document.getElementById('logout-modal');

		const btnOpenLogout =
			document.getElementById('btn-open-logout');

		const btnCancelLogout =
			document.getElementById('btn-cancel-logout');

		const btnConfirmLogout =
			document.getElementById('btn-confirm-logout');


		if (
			logoutModal &&
			btnOpenLogout &&
			btnCancelLogout &&
			btnConfirmLogout
		) {

			btnOpenLogout.addEventListener('click', event => {
				event.preventDefault();
				logoutModal.classList.add('active');
			});


			btnCancelLogout.addEventListener('click', () => {
				logoutModal.classList.remove('active');
			});


			btnConfirmLogout.addEventListener('click', () => {

				const logoutForm =
					document.getElementById('logoutForm');

				if (logoutForm) {
					logoutForm.submit();
				}

			});


			logoutModal.addEventListener('click', event => {

				if (event.target === logoutModal) {
					logoutModal.classList.remove('active');
				}

			});

		}

	</script>

</body>

</html>
