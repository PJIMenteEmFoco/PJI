<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>


	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Turmas - Mente em Foco</title>

	<link rel="stylesheet" th:href="@{/css/turmas-professor.css}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">

	<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>


	<!-- LOGOUT -->
	<form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;">

		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

	</form>


	<div class="app-layout">

		<!-- SIDEBAR -->
		<aside class="sidebar" id="sidebar">

			<div class="sidebar-header">

				<img th:src="@{/img/logo_solo.svg}" alt="Mente em Foco" class="logo-symbol-only">

				<img th:src="@{/img/logo_solo.svg}" alt="Mente em Foco" class="logo-full-white">

			</div>


			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">

				<i data-lucide="chevron-left"></i>

			</div>


			<nav class="sidebar-nav">

				<a th:href="@{/professor/dashboard}" class="nav-link">

					<i data-lucide="home"></i>

					<span class="nav-title">
						Início
					</span>

				</a>


				<a th:href="@{/professor/tarefas}" class="nav-link">

					<i data-lucide="book-open"></i>

					<span class="nav-title">
						Atividades
					</span>

				</a>


				<a th:href="@{/professor/chat}" class="nav-link">

					<i data-lucide="message-square"></i>

					<span class="nav-title">
						Chat
					</span>

				</a>


				<a th:href="@{/professor/calendario}" class="nav-link">

					<i data-lucide="calendar"></i>

					<span class="nav-title">
						Calendário
					</span>

				</a>


				<a th:href="@{/professor/turmas}" class="nav-link active">

					<i data-lucide="users"></i>

					<span class="nav-title">
						Turmas
					</span>

				</a>

			</nav>


			<div class="sidebar-footer">

				<a th:href="@{/professor/configuracoes}" class="nav-link">

					<i data-lucide="settings"></i>

					<span class="nav-title">
						Ajustes
					</span>

				</a>


				<button type="button" class="nav-link" id="btn-open-logout">

					<i data-lucide="log-out"></i>

					<span class="nav-title">
						Sair
					</span>

				</button>

			</div>

		</aside>


		<!-- CONTEÚDO PRINCIPAL -->
		<main class="main-content">

			<div class="teams-container">

				<h1 class="page-title">
					Turmas
				</h1>


				<!-- AÇÕES -->
				<div class="header-actions-row">

					<button type="button" class="btn-create-team"
						onclick="window.location.href='/professor/turmas/nova'">

						<i data-lucide="plus"></i>

						Criar turma

					</button>


					<div class="search-filter-group">

						<div class="search-input-box">

							<i data-lucide="search"></i>

							<input type="text" id="search-teams" placeholder="Pesquisar turmas..." autocomplete="off">

						</div>


						<select class="select-filter" id="filter-psico">

							<option value="">
								Todos os Psicopedagogos
							</option>

							<option th:each="psicopedagogo : ${psicopedagogos}" th:value="${psicopedagogo.id}"
								th:text="${psicopedagogo.nome}">

							</option>

						</select>

					</div>

				</div>


				<h2 class="section-title">
					Turmas
				</h2>


				<!-- GRID DAS TURMAS -->
				<div class="teams-grid" id="teams-grid">

					<!--
                    Cada card é criado pelo Thymeleaf.

                    turma.id       -> ID da turma
                    turma.nome     -> nome da turma
                    turma.usuarios -> usuários da turma
                -->

					<div class="team-card" th:each="turma : ${turmas}"
						th:onclick="|window.location.href='/professor/turma/${turma.id}'|"> <!-- Nome da turma -->
						<h3 class="team-card-title" th:text="${turma.nome}"> Turma </h3>
						<div class="team-card-body"> <!-- Alunos da turma -->
							<div class="avatar-stack">
								<th:block th:each="usuario, iterStat : ${turma.usuarios}"
									th:if="${usuario.perfil == 'ALUNO' and iterStat.index < 3}">
									<div class="avatar-circle"
										th:text="${usuario.nome != null and !usuario.nome.isEmpty() ? #strings.substring(usuario.nome, 0, 1).toUpperCase() : '?'}">
										A </div>
								</th:block>
							</div> <!-- Quantidade de alunos -->
							<div class="avatar-more-badge"> <i data-lucide="users" style="width:13px; height:13px;"></i>
								<span th:text="${#lists.size(turma.usuarios.?[perfil == 'ALUNO'])} + ' Alunos'"> 0
									Alunos </span>
							</div>
						</div>


						<!-- CASO NÃO TENHA TURMAS NO BANCO -->
						<div class="empty-teams-message" id="empty-teams-message" th:if="${#lists.isEmpty(turmas)}">

							<i data-lucide="users"></i>

							<p>
								Você ainda não possui nenhuma turma.
							</p>

						</div>


						<!-- CASO OS FILTROS NÃO ENCONTREM TURMAS -->
						<div class="empty-teams-message" id="no-results-message" style="display: none;">

							<i data-lucide="search-x"></i>

							<p>
								Nenhuma turma encontrada.
							</p>

						</div>

					</div>

				</div>

		</main>

	</div>


	<!-- MODAL DE LOGOUT -->
	<div class="modal-overlay" id="logout-modal">

		<div class="modal-card">

			<h2 class="modal-title">
				Tem certeza que deseja sair da sua conta?
			</h2>


			<div class="modal-actions">

				<button type="button" class="btn-modal btn-modal-cancel" id="btn-cancel-logout">

					Cancelar

				</button>


				<button type="button" class="btn-modal btn-modal-logout" id="btn-confirm-logout">

					Sair

				</button>

			</div>

		</div>

	</div>


	<script th:inline="javascript">

		/*
		 * LUCIDE
		 */
		lucide.createIcons();


		/*
		 * SIDEBAR
		 */
		const sidebar =
			document.getElementById('sidebar');

		const toggleBtn =
			document.getElementById('toggle-btn');


		if (sidebar && toggleBtn) {

			toggleBtn.addEventListener('click', () => {

				sidebar.classList.toggle('expanded');

			});

		}


		/*
		 * PESQUISA E FILTRO DE TURMAS
		 */
		const searchInput =
			document.getElementById('search-teams');

		const filterPsico =
			document.getElementById('filter-psico');

		const teamCards =
			document.querySelectorAll('.team-card');

		const noResultsMessage =
			document.getElementById('no-results-message');


		function filtrarTurmas() {

			const pesquisa =
				searchInput.value
					.trim()
					.toLowerCase();

			const psicopedagogoSelecionado =
				filterPsico.value;


			let turmasVisiveis = 0;


			teamCards.forEach(card => {

				const titulo =
					card.querySelector('.team-card-title')
						.textContent
						.toLowerCase();


				const footer =
					card.querySelector('.team-card-footer')
						.textContent
						.toLowerCase();


				/*
				 * Pega os psicopedagogos existentes
				 * dentro da turma.
				 */
				const psicopedagogos =
					card.querySelectorAll(
						'.psicopedagogo'
					);


				/*
				 * Verifica se a turma pertence
				 * ao psicopedagogo selecionado.
				 */
				const correspondePsicopedagogo =
					psicopedagogoSelecionado === '' ||
					Array.from(psicopedagogos).some(
						psicopedagogo =>
							psicopedagogo.dataset.psicopedagogoId ===
							psicopedagogoSelecionado
					);


				/*
				 * Verifica a pesquisa pelo nome
				 * da turma ou informações do footer.
				 */
				const correspondePesquisa =
					titulo.includes(pesquisa) ||
					footer.includes(pesquisa);


				const deveExibir =
					correspondePesquisa &&
					correspondePsicopedagogo;


				card.style.display =
					deveExibir ? 'flex' : 'none';


				if (deveExibir) {

					turmasVisiveis++;

				}

			});


			/*
			 * Mostra "Nenhuma turma encontrada"
			 * somente quando existem cards, mas
			 * nenhum passou pelos filtros.
			 */
			if (noResultsMessage) {

				noResultsMessage.style.display =
					turmasVisiveis === 0
						? 'flex'
						: 'none';

			}

		}


		if (searchInput) {

			searchInput.addEventListener(
				'input',
				filtrarTurmas
			);

		}


		if (filterPsico) {

			filterPsico.addEventListener(
				'change',
				filtrarTurmas
			);

		}


		/*
		 * LOGOUT
		 */
		const logoutModal =
			document.getElementById('logout-modal');

		const btnOpenLogout =
			document.getElementById('btn-open-logout');

		const btnCancelLogout =
			document.getElementById('btn-cancel-logout');

		const btnConfirmLogout =
			document.getElementById('btn-confirm-logout');


		if (
			logoutModal &&
			btnOpenLogout &&
			btnCancelLogout &&
			btnConfirmLogout
		) {

			btnOpenLogout.addEventListener('click', (event) => {

				event.preventDefault();

				logoutModal.classList.add('active');

			});


			btnCancelLogout.addEventListener('click', () => {

				logoutModal.classList.remove('active');

			});


			btnConfirmLogout.addEventListener('click', () => {

				document
					.getElementById('logoutForm')
					.submit();

			});


			/*
			 * Fecha o modal clicando fora.
			 */
			logoutModal.addEventListener('click', (event) => {

				if (event.target === logoutModal) {

					logoutModal.classList.remove('active');

				}

			});

		}

	</script>

</body>

</html>
