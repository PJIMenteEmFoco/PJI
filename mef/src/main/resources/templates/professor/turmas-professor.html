<!DOCTYPE html> <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turmas - Mente em Foco</title>

<link rel="stylesheet" th:href="@{/css/turmas-professor.css}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
    rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

</head> <body>
<!-- LOGOUT -->
<form th:action="@{/logout}" method="post" id="logoutForm" style="display:none;">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
</form>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <img th:src="@{/img/logo.png}"
                 alt="Mente em Foco"
                 class="logo-symbol-only">

            <img th:src="@{/img/logo.png}"
                 alt="Mente em Foco"
                 class="logo-full-white">
        </div>

        <div class="sidebar-toggle-badge"
             id="toggle-btn"
             title="Expandir/Recolher Menu">

            <i data-lucide="chevron-left"></i>

        </div>

        <nav class="sidebar-nav">

            <a th:href="@{/professor/dashboard}" class="nav-link">
                <i data-lucide="home"></i>
                <span class="nav-title">Início</span>
            </a>

            <a th:href="@{/professor/tarefas}" class="nav-link">
                <i data-lucide="book-open"></i>
                <span class="nav-title">Atividades</span>
            </a>

            <a th:href="@{/professor/chat}" class="nav-link">
                <i data-lucide="message-square"></i>
                <span class="nav-title">Chat</span>
            </a>

            <a href="#" class="nav-link">
                <i data-lucide="calendar"></i>
                <span class="nav-title">Calendário</span>
            </a>

            <a th:href="@{/professor/turmas}"
               class="nav-link active">

                <i data-lucide="users"></i>
                <span class="nav-title">Turmas</span>

            </a>

        </nav>

        <div class="sidebar-footer">

            <a th:href="@{/professor/configuracoes}"
               class="nav-link">

                <i data-lucide="settings"></i>
                <span class="nav-title">Ajustes</span>

            </a>

            <button class="nav-link"
                    id="btn-open-logout">

                <i data-lucide="log-out"></i>
                <span class="nav-title">Sair</span>

            </button>

        </div>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <div class="teams-container">

            <h1 class="page-title">
                Turmas
            </h1>


            <!-- AÇÕES -->
            <div class="header-actions-row">

                <button class="btn-create-team">
                    <i data-lucide="plus"></i>
                    Criar turma
                </button>


                <div class="search-filter-group">

                    <div class="search-input-box">

                        <i data-lucide="search"></i>

                        <input
                            type="text"
                            id="search-teams"
                            placeholder="Pesquisar turmas...">

                    </div>


                    <select class="select-filter"
                            id="filter-psico">

                        <option value="">
                            Todos os Psicopedagogos
                        </option>

                        <option value="lucas">
                            Psicopedagogo Lucas Bonetti
                        </option>

                    </select>

                </div>

            </div>


            <h2 class="section-title">
                Turmas
            </h2>


            <!-- GRID DAS TURMAS -->
            <div class="teams-grid"
                 id="teams-grid">


                <!--
                    Cada card é criado pelo Thymeleaf.

                    Exemplo:

                    turma.id   -> ID da turma
                    turma.nome -> nome da turma
                    turma.usuarios -> usuários da turma
                -->

                <div class="team-card"
                     th:each="turma : ${turmas}"
                     th:attr="data-turma-id=${turma.id}"
                     th:onclick="|window.location.href='/professor/turma/${turma.id}'|">


                    <!-- NOME -->
                    <h3 class="team-card-title"
                        th:text="${turma.nome}">

                        Turma

                    </h3>


                    <div class="team-card-body">


                        <!-- AVATARES -->
                        <div class="avatar-stack">


                            <!--
                                Mostra no máximo 3 usuários.
                                Como o professor também está relacionado,
                                filtramos somente ALUNO.
                            -->

                            <th:block
                                th:each="aluno, iter : ${turma.usuarios}">

                                <div
                                    class="avatar-circle"
                                    th:if="${aluno.perfil == 'ALUNO' and iter.index < 3}"
                                    th:text="${#strings.substring(aluno.nome, 0, 2).toUpperCase()}">

                                    AB

                                </div>

                            </th:block>


                        </div>


                        <!-- QUANTIDADE DE ALUNOS -->
                        <div class="avatar-more-badge">

                            <i data-lucide="users"
                               style="width:13px; height:13px;">
                            </i>

                            <span
                                th:text="${#lists.size(turma.usuarios.?[perfil == 'ALUNO']) + ' Alunos'}">

                                0 Alunos

                            </span>

                        </div>

                    </div>


                    <!-- RODAPÉ -->
                    <div class="team-card-footer">

                        <span>
                            <strong>Professor:</strong>

                            <span th:text="${usuarioLogado.nome}">
                                Professor
                            </span>
                        </span>

                    </div>

                </div>


                <!-- CASO NÃO TENHA TURMAS -->
                <div
                    class="empty-teams-message"
                    th:if="${#lists.isEmpty(turmas)}">

                    <i data-lucide="users"></i>

                    <p>
                        Você ainda não possui nenhuma turma.
                    </p>

                </div>


            </div>

        </div>

    </main>

</div>


<!-- MODAL DE LOGOUT -->
<div class="modal-overlay"
     id="logout-modal">

    <div class="modal-card">

        <h2 class="modal-title">
            Tem certeza que deseja sair da sua conta?
        </h2>

        <div class="modal-actions">

            <button
                class="btn-modal btn-modal-cancel"
                id="btn-cancel-logout">

                Cancelar

            </button>

            <button
                class="btn-modal btn-modal-logout"
                id="btn-confirm-logout">

                Sair

            </button>

        </div>

    </div>

</div>


<script th:inline="javascript">

    /*
     * Ícones
     */
    lucide.createIcons();


    /*
     * SIDEBAR
     */
    const sidebar =
        document.getElementById('sidebar');

    const toggleBtn =
        document.getElementById('toggle-btn');


    toggleBtn.addEventListener('click', () => {

        sidebar.classList.toggle('expanded');

    });


    /*
     * LOGOUT
     */
    const logoutModal =
        document.getElementById('logout-modal');

    const btnOpenLogout =
        document.getElementById('btn-open-logout');

    const btnCancelLogout =
        document.getElementById('btn-cancel-logout');

    const btnConfirmLogout =
        document.getElementById('btn-confirm-logout');


    btnOpenLogout.addEventListener('click', (event) => {

        event.preventDefault();

        logoutModal.classList.add('active');

    });


    btnCancelLogout.addEventListener('click', () => {

        logoutModal.classList.remove('active');

    });


    btnConfirmLogout.addEventListener('click', () => {

        document
            .getElementById('logoutForm')
            .submit();

    });


    /*
     * PESQUISA DE TURMAS
     */
    const searchInput =
        document.getElementById('search-teams');

    const teamCards =
        document.querySelectorAll('.team-card');


    searchInput.addEventListener('input', () => {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        teamCards.forEach(card => {

            const title =
                card
                    .querySelector('.team-card-title')
                    .textContent
                    .toLowerCase();


            const footer =
                card
                    .querySelector('.team-card-footer')
                    .textContent
                    .toLowerCase();


            const matches =
                title.includes(query) ||
                footer.includes(query);


            card.style.display =
                matches ? 'flex' : 'none';

        });

    });


    /*
     * FECHA O MODAL CLICANDO FORA
     */
    logoutModal.addEventListener('click', (event) => {

        if (event.target === logoutModal) {

            logoutModal.classList.remove('active');

        }

    });

</script>

</body> </html>
