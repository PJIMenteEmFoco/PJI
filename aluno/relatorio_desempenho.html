<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho da Atividade - Mente em Foco</title>
    <link rel="stylesheet" href="../style/relatorio_desempenho.css">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../imagens/logo.png" alt="Mente em Foco" class="logo-symbol-only">
                <img src="../imagens/logo.png" alt="Mente em Foco" class="logo-full-white">
            </div>

            <div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
                <i data-lucide="chevron-left"></i>
            </div>

            <nav class="sidebar-nav">
                <a href="../aluno/dashboard_aluno.html" class="nav-link">
                    <i data-lucide="home"></i>
                    <span class="nav-title">Início</span>
                </a>
                <a href="../aluno/tarefas_aluno.html" class="nav-link active">
                    <i data-lucide="book-open"></i>
                    <span class="nav-title">Atividades</span>
                </a>
                <a href="chat_aluno.html" class="nav-link">
                    <i data-lucide="message-square"></i>
                    <span class="nav-title">Chat</span>
                </a>
                <a href="calendario_aluno.html" class="nav-link">
                    <i data-lucide="calendar"></i>
                    <span class="nav-title">Calendário</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../aluno/configuracoes_aluno.html" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span class="nav-title">Ajustes</span>
                </a>
                <button class="nav-link" id="btn-open-logout">
                    <i data-lucide="log-out"></i>
                    <span class="nav-title">Sair</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="result-container">
                <a href="../aluno/tarefas_aluno.html" class="btn-back">
                    <i data-lucide="arrow-left"></i>
                    <span>Voltar para Tarefas</span>
                </a>

                <div class="result-card">
                    <div class="trophy-badge">
                        <i data-lucide="trophy"></i>
                    </div>

                    <div>
                        <h1 class="result-title" id="res-greeting">Desempenho Perfeito, Levi!</h1>
                        <p id="res-subtitle" style="color:#637783; font-weight:700; font-size:0.9rem; margin-top:4px;">Atividade: Quiz Guiado</p>
                    </div>

                    <div class="result-stats-row">
                        <div class="result-stat-box">
                            <span>Pontuação</span>
                            <div class="result-score" style="color:#E69C2E;" id="res-score">100%</div>
                        </div>
                        <div class="result-stat-box">
                            <span>Tempo Gasto</span>
                            <div class="result-score" id="res-time">00:00</div>
                        </div>
                        <div class="result-stat-box">
                            <span>XP Ganho</span>
                            <div class="result-score" style="color:#27ae60;" id="res-xp">+50 XP</div>
                        </div>
                    </div>

                    <div class="result-actions">
                        <button class="btn-action btn-retry" id="btn-retry">
                            <i data-lucide="rotate-ccw"></i>
                            <span>Praticar Novamente</span>
                        </button>
                        <a href="../aluno/tarefas_aluno.html" class="btn-action btn-finish">
                            <span>Concluir</span>
                            <i data-lucide="check"></i>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="logout-modal">
        <div class="modal-card-logout">
            <h3 class="modal-logout-title">Tem certeza que deseja sair da sua conta?</h3>
            <div class="modal-logout-actions">
                <button class="btn-logout-cancel" id="btn-cancel-logout">Cancelar</button>
                <button class="btn-logout-confirm" id="btn-confirm-logout">Sair</button>
            </div>
        </div>
    </div>

    <script>
        (function initTheme() {
            if (localStorage.getItem('theme') === 'escuro') {
                document.body.classList.add('dark-mode');
            }
        })();

        lucide.createIcons();

        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('expanded'));
        }

        const logoutModal = document.getElementById('logout-modal');
        document.getElementById('btn-open-logout')?.addEventListener('click', (e) => {
            e.preventDefault();
            logoutModal.classList.add('active');
        });
        document.getElementById('btn-cancel-logout')?.addEventListener('click', () => logoutModal.classList.remove('active'));
        document.getElementById('btn-confirm-logout')?.addEventListener('click', () => window.location.href = '../login/login.html');

        const savedData = localStorage.getItem('menteEmFoco_lastResult');

        if (savedData) {
            const data = JSON.parse(savedData);

            document.getElementById('res-time').textContent = data.timeFormatted || '00:00';
            document.getElementById('res-xp').textContent = `+${data.xpGained ?? 50} XP`;
            document.getElementById('res-score').textContent = `${data.score ?? 100}%`;

            const subtitleEl = document.getElementById('res-subtitle');
            if (subtitleEl && data.taskTitle) {
                subtitleEl.textContent = `Atividade: ${data.taskTitle}`;
            }

            const greetingEl = document.getElementById('res-greeting');

            if (data.score === 100) {
                greetingEl.textContent = 'Desempenho Perfeito, Levi!';
            } else if (data.score >= 50) {
                greetingEl.textContent = 'Excelente Trabalho, Levi!';
            } else {
                greetingEl.textContent = 'Continue Treinando, Levi!';
            }
        }

        document.getElementById('btn-retry')?.addEventListener('click', () => {
            let tarefas = JSON.parse(localStorage.getItem('mente_em_foco_tarefas')) || [];
            
            if (tarefas.length > 0) {
                tarefas = tarefas.map(t => {
                    t.status = 'Ativa';
                    return t;
                });
                localStorage.setItem('mente_em_foco_tarefas', JSON.stringify(tarefas));
            }

            window.location.href = 'executar_atividade.html';
        });
    </script>
</body>
</html>
