<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tarefas Aluno - Mente em Foco</title>
	<link rel="stylesheet" href="/css/tarefas_aluno.css" th:href="@{/css/tarefas_aluno.css}">
	<link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">
	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>

	<link rel="stylesheet" href="/css/recursos.css" th:href="@{/css/recursos.css}">
	<link rel="stylesheet" href="/css/correcoes.css" th:href="@{/css/correcoes.css}">
	<link rel="stylesheet" href="/css/popups.css" th:href="@{/css/popups.css}">
	<link rel="stylesheet" href="/css/revisao.css" th:href="@{/css/revisao.css}">
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<link rel="stylesheet" href="/css/escolhas.css" th:href="@{/css/escolhas.css}">
</head>

<body data-original="true" data-mef-backend="true">

	<div class="app-layout">

		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-symbol-only">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-left"></i>
			</div>

			<nav class="sidebar-nav">
				<a href="/aluno/dashboard" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a href="/aluno/tarefas" th:href="@{/aluno/tarefas}" class="nav-link active">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a href="/aluno/chat" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="/aluno/calendario" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
			</nav>

			<div class="sidebar-footer">
				<a href="/aluno/configuracoes" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>

		<main class="main-content">
			<div class="tasks-container">

				<h1 class="page-title">Tarefas</h1>

				<div class="task-section">
					<h2 class="section-title">Tarefas pendentes</h2>
					<div class="cards-grid-row"><p role="status">Carregando atividades...</p></div>
				</div>

				<div class="task-section">
					<h2 class="section-title">Tarefas atrasadas</h2>
					<div class="cards-grid-row"><p role="status">Carregando atividades...</p></div>
				</div>

				<div class="task-section">
					<button class="toggle-section-btn" id="toggle-delivered-btn">
						<h2 class="section-title">Tarefas entregues</h2>
						<i data-lucide="chevron-down" id="arrow-icon"></i>
					</button>

					<div class="delivered-grid" id="delivered-grid"><p role="status">Carregando atividades...</p></div>
				</div>

			</div>
		</main>

	</div>

	<div class="modal-overlay" id="logout-modal">
		<div class="modal-card-logout">
			<h3 class="modal-logout-title">Tem certeza que deseja sair da sua conta?</h3>
			<div class="modal-logout-actions">
				<button class="btn-logout-cancel" id="btn-cancel-logout">Cancelar</button>
				<button class="btn-logout-confirm" id="btn-confirm-logout">Sair</button>
			</div>
		</div>
	</div>


	<script src="/script/dados.js" th:src="@{/script/dados.js}"></script>
	<script src="/script/cruzadas.js" th:src="@{/script/cruzadas.js}"></script>
	<script src="/script/progresso.js" th:src="@{/script/progresso.js}"></script>
	<script src="/script/documentos.js" th:src="@{/script/documentos.js}"></script>
	<script src="/script/cruzadas-navegacao.js" th:src="@{/script/cruzadas-navegacao.js}"></script>
	<script src="/script/recursos.js" th:src="@{/script/recursos.js}"></script>
	<script src="/script/popups.js" th:src="@{/script/popups.js}"></script>
	<script src="/script/revisao.js" th:src="@{/script/revisao.js}"></script>
	<script src="/script/escolhas.js" th:src="@{/script/escolhas.js}"></script>
	<script src="/script/mef-tarefas-aluno-backend.js" th:src="@{/script/mef-tarefas-aluno-backend.js}"></script>
<form id="mef-lista-logout" method="post" th:action="@{/logout}" hidden></form>
<script th:src="@{/script/mef-comum.js}" src="/script/mef-comum.js"></script>
<script th:src="@{/script/mef-listas-controles.js}" src="/script/mef-listas-controles.js"></script>
</body>

</html>
