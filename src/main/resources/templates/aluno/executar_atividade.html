<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Executar Atividade - Mente em Foco</title>
	<link rel="stylesheet" href="/css/executar_atividade.css" th:href="@{/css/executar_atividade.css}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">
	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>

	<link rel="stylesheet" href="/css/recursos.css" th:href="@{/css/recursos.css}">
	<link rel="stylesheet" href="/css/correcoes.css" th:href="@{/css/correcoes.css}">
	<link rel="stylesheet" href="/css/popups.css" th:href="@{/css/popups.css}">
	<link rel="stylesheet" href="/css/revisao.css" th:href="@{/css/revisao.css}">
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<link rel="stylesheet" href="/css/escolhas.css" th:href="@{/css/escolhas.css}">
	<link rel="stylesheet" href="/css/mef-executar-backend.css" th:href="@{/css/mef-executar-backend.css}">
	<meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
	<meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
<link rel="stylesheet" href="/css/ajustes-front.css" th:href="@{/css/ajustes-front.css}">
<meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
</head>

<body data-mef-profile="aluno" data-original="true" data-mef-backend="true">

	<form id="mef-logout-form" th:action="@{/logout}" method="post" hidden>
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	</form>
	<div class="app-layout">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-symbol-only">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-left"></i>
			</div>

			<nav class="sidebar-nav">
				<a href="/aluno/dashboard" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a href="/aluno/tarefas" class="nav-link active">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a href="/aluno/chat" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="/aluno/calendario" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
			<button type="button" class="nav-link" data-mef-notifications aria-label="Notificações" title="Notificações"><i data-lucide="bell" aria-hidden="true"></i><span class="nav-title">Notificações</span></button></nav>

			<div class="sidebar-footer">
				<a href="/aluno/configuracoes" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>

		<main class="main-content">
			<div class="activity-container">
				<div class="activity-header">
					<a href="/aluno/tarefas" class="btn-back">
						<i data-lucide="arrow-left"></i>
						<span>Voltar para Tarefas</span>
					</a>

					<div class="activity-info-group">
						<div class="stat-badge">
							<i data-lucide="clock"></i>
							<span id="timer-display">00:00</span>
						</div>
						<div class="stat-badge">
							<i data-lucide="award"></i>
							<span>+50 XP</span>
						</div>
					</div>
				</div>

				<div class="game-board-card">
					<div class="game-title-box">
						<h2 id="task-display-title">Carregando Atividade...</h2>
						<p id="task-display-instructions">Aguarde um momento.</p>
					</div>

					<div class="quiz-container" id="quiz-dynamic-container">
					</div>

					<div class="action-footer-row">
						<button class="btn-submit-task" id="btn-finish-quiz">
							<span>Entregar Atividade</span>
							<i data-lucide="check-circle-2"></i>
						</button>
					</div>
				</div>
			</div>
		</main>
	</div>

	<div class="modal-overlay" id="logout-modal">
		<div class="modal-card-logout">
			<h3 class="modal-logout-title">Tem certeza que deseja sair da sua conta?</h3>
			<div class="modal-logout-actions">
				<button class="btn-logout-cancel" id="btn-cancel-logout">Cancelar</button>
				<button class="btn-logout-confirm" id="btn-confirm-logout">Sair</button>
			</div>
		</div>
	</div>

	<div class="modal-overlay" id="warning-modal">
		<div class="modal-card-warning">
			<div class="warning-icon-circle">
				<i data-lucide="alert-circle"></i>
			</div>
			<h3 class="modal-warning-title">Atenção!</h3>
			<p class="modal-warning-text" id="warning-modal-text">Por favor, responda a todas as perguntas antes de
				entregar.</p>
			<button class="btn-warning-ok" id="btn-warning-ok">Entendi</button>
		</div>
	</div>


	<script src="/script/dados.js" th:src="@{/script/dados.js}"></script>
	<script src="/script/cruzadas.js" th:src="@{/script/cruzadas.js}"></script>
	<script src="/script/progresso.js" th:src="@{/script/progresso.js}"></script>
	<script src="/script/documentos.js" th:src="@{/script/documentos.js}"></script>
	<script src="/script/cruzadas-navegacao.js" th:src="@{/script/cruzadas-navegacao.js}"></script>
	<script src="/script/recursos.js" th:src="@{/script/recursos.js}"></script>
	<script src="/script/interface-original.js" th:src="@{/script/interface-original.js}"></script>
	<script src="/script/popups.js" th:src="@{/script/popups.js}"></script>
	<script src="/script/convites.js" th:src="@{/script/convites.js}"></script>
	<script src="/script/revisao.js" th:src="@{/script/revisao.js}"></script>
	<script src="/script/escolhas.js" th:src="@{/script/escolhas.js}"></script>
	<script src="/script/mef-executar-atividade-backend.js"
		th:src="@{/script/mef-executar-atividade-backend.js}"></script>
<script defer src="/script/ajustes-front.js" th:src="@{/script/ajustes-front.js}"></script>
</body>

</html>
