<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Chat - Mente em Foco</title>
	<link href="/css/global.css" rel="stylesheet" th:href="@{/css/global.css}" />
	<link href="/css/chatAluno.css" rel="stylesheet" th:href="@{/css/chatAluno.css}" />
	<link href="https://fonts.googleapis.com" rel="preconnect" />
	<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&amp;family=Montserrat:wght@600;700;800;900&amp;display=swap"
		rel="stylesheet" />
	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>
	<style>
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: rgba(15, 45, 60, 0.45);
			backdrop-filter: blur(4px);
			-webkit-backdrop-filter: blur(4px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1000;
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.modal-overlay.active {
			opacity: 1;
			visibility: visible;
		}

		.logout-outer-card {
			background-color: #CBDDE6;
			border-radius: 20px;
			padding: 24px;
			width: 100%;
			max-width: 460px;
			box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
		}

		.logout-inner-card {
			background-color: #ffffff;
			border-radius: 16px;
			padding: 28px 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 20px;
			text-align: center;
		}

		.logout-inner-card h3 {
			font-size: 1rem;
			font-weight: 800;
			color: #0F2D3C;
			line-height: 1.3;
			font-family: 'Montserrat', sans-serif;
		}

		.logout-btn-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			width: 100%;
		}

		.btn-logout-cancel {
			flex: 1;
			background-color: #557D91;
			color: #ffffff;
			border: none;
			padding: 10px;
			border-radius: 20px;
			font-family: 'Montserrat', sans-serif;
			font-size: 0.85rem;
			font-weight: 700;
			cursor: pointer;
			transition: background-color 0.2s ease;
		}

		.btn-logout-cancel:hover {
			background-color: #0F2D3C;
		}

		.btn-logout-confirm {
			flex: 1;
			background-color: #f1f5f8;
			color: #557D91;
			border: 1px solid #d9e3eb;
			padding: 10px;
			border-radius: 20px;
			font-family: 'Montserrat', sans-serif;
			font-size: 0.85rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-logout-confirm:hover {
			background-color: #e2ebf0;
			color: #0F2D3C;
		}
	</style>
	<link href="/css/recursos.css" rel="stylesheet" th:href="@{/css/recursos.css}" />
	<link href="/css/correcoes.css" rel="stylesheet" th:href="@{/css/correcoes.css}" />
	<link href="/css/popups.css" rel="stylesheet" th:href="@{/css/popups.css}" />
	<link href="/css/revisao.css" rel="stylesheet" th:href="@{/css/revisao.css}" />
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<link href="/css/escolhas.css" rel="stylesheet" th:href="@{/css/escolhas.css}" />
	<link href="/css/chat-aluno-integracao.css" rel="stylesheet" th:href="@{/css/chat-aluno-integracao.css}" />
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body data-original="true" data-chat-mode="backend" th:attr="data-user-id=${usuarioLogadoId}">
	<form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;">
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	</form>
	<div class="app-layout">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img alt="Mente em Foco" class="logo-symbol-only" src="/img/logo_solo.svg"
					th:src="@{/img/logo_solo.svg}" />
				<img alt="Mente em Foco" class="logo-full-white" src="/img/logo_solo.svg"
					th:src="@{/img/logo_solo.svg}" />
			</div>
			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu" role="button" tabindex="0"
				aria-label="Expandir ou recolher menu">
				<i data-lucide="chevron-left"></i>
			</div>
			<nav class="sidebar-nav">
				<a class="nav-link" href="/aluno/dashboard" th:href="@{/aluno/dashboard}">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a class="nav-link" href="/aluno/tarefas" th:href="@{/aluno/tarefas}">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a class="nav-link active" href="/aluno/chat" th:href="@{/aluno/chat}">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a class="nav-link" href="/aluno/calendario" th:href="@{/aluno/calendario}">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
			</nav>
			<div class="sidebar-footer">
				<a class="nav-link" href="/aluno/configuracoes" th:href="@{/aluno/configuracoes}">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>
		<div class="chat-container">
			<div class="chat-sidebar">
				<div class="chat-sidebar-header">
					<h2 class="chat-sidebar-title">Chat</h2>
					<span aria-hidden="true" class="chat-heading-icon"><i data-lucide="message-square"></i></span>
				</div>
				<div class="contacts-list" id="contacts-list">
					<div class="contact-item" th:each="contato : ${contatos}"
						th:attr="data-id=${contato.id},data-nome=${contato.nome}">
						<div class="avatar-box"><i data-lucide="user"></i></div>
						<div class="contact-info">
							<span class="contact-name" th:text="${contato.nome}">Contato</span>
							<span class="contact-role-badge"
								th:text="${contato.perfil == 'PSICOPEDAGOGO' ? 'Psicopedagogo' : 'Professor'}">Professor</span>
						</div>
					</div>
					<p class="chat-empty" th:if="${#lists.isEmpty(contatos)}">Você ainda não possui professores ou
						psicopedagogos vinculados às suas turmas.</p>
				</div>
			</div>
			<div class="chat-main">
				<div class="chat-main-header">
					<div class="active-user-info">
						<div class="avatar-box" id="active-avatar-box" style="width:38px; height:38px; border:none;">
							<i data-lucide="user-check"></i>
						</div>
						<div>
							<span class="active-contact-title" id="active-contact-name"
								th:text="${#lists.isEmpty(contatos) ? 'Nenhum contato' : 'Selecione um contato'}">—</span>
						</div>
					</div>
				</div>
				<div class="messages-wrapper" id="messages-wrapper"></div>
				<div class="chat-input-bar">
					<div class="input-group">
						<button class="btn-plus-attach" title="Anexar arquivo ou imagem">
							<i data-lucide="plus"></i>
						</button>
						<input class="chat-text-input" id="chat-input" onkeypress="handleKeyPress(event)"
							placeholder="Mensagem..." type="text" />
						<button class="btn-send-msg" onclick="sendMessage()" title="Enviar mensagem">
							<i data-lucide="send"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="modal-overlay" id="logout-modal" aria-hidden="true">
		<div class="modal-card">
			<h2 class="modal-title">Tem certeza que deseja sair da sua conta?</h2>
			<div class="modal-actions">
				<button class="btn-modal btn-modal-cancel" id="btn-cancel-logout">Cancelar</button>
				<button class="btn-modal btn-modal-logout" id="btn-confirm-logout" type="button">Sair</button>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
	<script th:inline="javascript">
		window.MEF_CHAT_CONFIG = {
			usuarioLogadoId: /*[[${usuarioLogadoId}]]*/ null,
			wsUrl: /*[[@{/ws}]]*/ '/ws',
			historicoBase: /*[[@{/aluno/chat/historico/}]]*/ '/aluno/chat/historico/'
		};
	</script>
	<script defer src="/script/mef-chat-aluno.js" th:src="@{/script/mef-chat-aluno.js}"></script>
</body>

</html>
