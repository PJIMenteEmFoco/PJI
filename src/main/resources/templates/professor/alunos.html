<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Mente em Foco</title>
	<link href="/css/detalhes-turma.css" rel="stylesheet" th:href="@{/css/detalhes-turma.css}" />
	<link href="/css/global.css" rel="stylesheet" th:href="@{/css/global.css}" />
	<link href="https://fonts.googleapis.com" rel="preconnect" />
	<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&amp;family=Montserrat:wght@600;700;800;900&amp;display=swap"
		rel="stylesheet" />
	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>
	<link href="/css/recursos.css" rel="stylesheet" th:href="@{/css/recursos.css}" />
	<link href="/css/correcoes.css" rel="stylesheet" th:href="@{/css/correcoes.css}" />
	<link href="/css/popups.css" rel="stylesheet" th:href="@{/css/popups.css}" />
	<link href="/css/revisao.css" rel="stylesheet" th:href="@{/css/revisao.css}" />
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<link href="/css/escolhas.css" rel="stylesheet" th:href="@{/css/escolhas.css}" />
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body data-original="true" data-page="alunos">
	<div class="app-layout">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img alt="Mente em Foco" class="logo-symbol-only" src="/img/logo_solo.svg"
					th:src="@{/img/logo_solo.svg}" />
				<img alt="Mente em Foco" class="logo-full-white" src="/img/logo_solo.svg"
					th:src="@{/img/logo_solo.svg}" />
			</div>
			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-left"></i>
			</div>
			<nav class="sidebar-nav">
				<a class="nav-link" href="/professor/dashboard" th:href="@{/professor/dashboard}">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a class="nav-link" href="/professor/tarefas" th:href="@{/professor/tarefas}">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a class="nav-link" href="/professor/chat" th:href="@{/professor/chat}">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a class="nav-link" href="/professor/calendario" th:href="@{/professor/calendario}">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
				<a class="nav-link" href="/professor/turmas" th:href="@{/professor/turmas}">
					<i data-lucide="users"></i>
					<span class="nav-title">Turmas</span>
				</a>
			</nav>
			<div class="sidebar-footer">
				<a class="nav-link" href="/professor/configuracoes" th:href="@{/professor/configuracoes}">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>
		<main class="main-content">
			<div class="mef-page" id="mef-root">
				<header class="mef-header">
					<div>
						<h1>Alunos</h1>
						<p class="mef-sub">Ficha individual e acompanhamento escolar.</p>
					</div>
					<div class="mef-actions">
						<a class="mef-btn primary" href="/professor/turmas" th:href="@{/professor/turmas}"
							title="Gerenciar turmas e convites">Gerenciar turmas</a>
					</div>
				</header>
				<div class="mef-filters">
					<label class="mef-field" for="search">Buscar por nome ou turma
						<input autocomplete="off" id="search" maxlength="150" placeholder="Nome, e-mail ou turma"
							type="search" />
					</label>
					<label class="mef-field" for="class-filter">Turma
						<select id="class-filter">
							<option value="">Todas</option>
							<option th:each="turma : ${turmas}" th:text="${turma.nome}" th:value="${turma.id}">Turma
							</option>
						</select>
					</label>
				</div>
				<p aria-live="polite" class="mef-muted" id="students-count"
					th:attr="data-total=${#lists.size(alunosCards)}"></p>
				<div class="mef-grid" id="student-list">
					<article class="mef-card aluno-card"
						th:attr="data-search=${aluno.textoBusca},data-turmas=${aluno.idsTurmas}"
						th:each="aluno : ${alunosCards}">
						<span class="mef-tag" th:each="turma : ${aluno.turmas}" th:text="${turma.nome}">Turma</span>
						<span class="mef-tag" th:if="${#lists.isEmpty(aluno.turmas)}">Sem turma identificada</span>
						<h2 th:text="${aluno.nome}">Nome do aluno</h2>
						<p class="mef-muted"
							th:text="${aluno.email != null and !#strings.isEmpty(aluno.email) ? aluno.email : 'E-mail não informado'}">
							E-mail</p>
						<div class="mef-actions">
							<a class="mef-btn primary" th:href="@{/professor/turmas/{id}(id=${aluno.turmas[0].id})}"
								th:if="${!#lists.isEmpty(aluno.turmas)}">Ver turma</a>
							<a class="mef-btn primary" href="/professor/alunos/0/ficha"
								th:href="@{/professor/alunos/{id}/ficha(id=${aluno.id})}">Ver ficha</a>
							<button class="mef-btn" disabled=""
								title="O painel de relatórios será integrado em uma etapa posterior"
								type="button">Relatórios</button>
						</div>
					</article>
				</div>
				<p class="mef-empty" id="students-no-data" th:if="${#lists.isEmpty(alunosCards)}">Nenhum aluno vinculado
					às suas turmas.</p>
				<p class="mef-empty" hidden="" id="students-no-match">Nenhum aluno corresponde aos filtros.</p>
			</div>
		</main>
	</div>
	<script defer="defer" src="/script/mef-alunos-backend.js" th:src="@{/script/mef-alunos-backend.js}"></script>
</body>

</html>
