<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Criar Nova Tarefa - Mente em Foco</title>
	<link rel="stylesheet" href="/css/criar-nova-tarefa.css" th:href="@{/css/criar-nova-tarefa.css}">
	<link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">
	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>
	<link rel="stylesheet" href="/css/recursos.css" th:href="@{/css/recursos.css}">
	<link rel="stylesheet" href="/css/correcoes.css" th:href="@{/css/correcoes.css}">
	<link rel="stylesheet" href="/css/popups.css" th:href="@{/css/popups.css}">
	<link rel="stylesheet" href="/css/revisao.css" th:href="@{/css/revisao.css}">
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<link rel="stylesheet" href="/css/escolhas.css" th:href="@{/css/escolhas.css}">
	<meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
	<meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
<link rel="stylesheet" href="/css/ajustes-front.css" th:href="@{/css/ajustes-front.css}">
<meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
</head>

<body data-mef-profile="professor" data-original="true" data-mef-backend="true" data-task-return-url="/professor/tarefas"
	th:attr="data-task-save-url=${salvarAtividadeUrl}">
	<form id="mef-logout-form" th:action="@{/logout}" method="post" hidden>
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	</form>

	<div class="app-layout">

		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-symbol-only">
				<img src="/img/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco"
					class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-left"></i>
			</div>

			<nav class="sidebar-nav">
				<a href="/professor/dashboard" th:href="@{/professor/dashboard}" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a href="/professor/tarefas" th:href="@{/professor/tarefas}" class="nav-link active">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a href="/professor/chat" th:href="@{/professor/chat}" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="/professor/calendario" th:href="@{/professor/calendario}" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
				<a href="/professor/turmas" th:href="@{/professor/turmas}" class="nav-link">
					<i data-lucide="users"></i>
					<span class="nav-title">Turmas</span>
				</a>
			<button type="button" class="nav-link" data-mef-notifications aria-label="Notificações" title="Notificações"><i data-lucide="bell" aria-hidden="true"></i><span class="nav-title">Notificações</span></button></nav>

			<div class="sidebar-footer">
				<a href="/professor/configuracoes" th:href="@{/professor/configuracoes}" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>

		<main class="main-content">

			<svg class="bg-watermark-book" viewBox="0 0 24 24" fill="none" stroke="#557D91" stroke-width="1.2">
				<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
				<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
			</svg>

			<div class="create-task-container">

				<div class="page-header">
					<a href="/professor/tarefas" th:href="@{/professor/tarefas}" class="btn-back-link"
						title="Voltar para Tarefas">
						<i data-lucide="arrow-left"></i>
					</a>
					<div class="page-title-group">
						<i data-lucide="book-open"></i>
						<h1 class="page-title">Criar Nova Tarefa</h1>
					</div>
				</div>

				<div class="step-block">
					<div class="step-header">
						<span class="step-number">1</span>
						<h2 class="step-title">Título e Instruções</h2>
					</div>

					<div class="form-group">
						<label class="form-label">Título da Tarefa</label>
						<input type="text" id="task-title" class="form-input"
							placeholder="Ex: Ortografia e Foco no TDAH">
					</div>

					<div class="form-group">
						<label class="form-label">Instruções da Tarefa (Textos curtos e objetivos)</label>
						<textarea id="task-instructions" class="form-textarea"
							placeholder="Descreva as orientações claras para o aluno..."></textarea>
					</div>
				</div>

				<div class="step-block">
					<div class="step-header">
						<span class="step-number">2</span>
						<h2 class="step-title">Configurar Conteúdo</h2>
					</div>

					<div class="builder-layout">

						<div class="type-selector-card">
							<i data-lucide="help-circle"></i>
							<span>Quiz Adaptado</span>
						</div>

						<div id="questions-container"
							style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
							<div class="question-box" data-qindex="1">
								<div class="question-header">
									<i data-lucide="grip-vertical" style="color:#557D91;"></i>
									<input type="text" class="question-input" value="quem jogou mais?"
										placeholder="Digite a pergunta aqui...">
									<button type="button" class="btn-trash btn-delete-question"
										title="Excluir Pergunta"><i data-lucide="trash-2"></i></button>
								</div>

								<div class="answers-list">
									<div class="answer-item">
										<input type="radio" name="q1" checked title="Marcar como alternativa correta">
										<input type="text" class="answer-input" value="Ronaldo"
											placeholder="Texto da alternativa...">
									</div>
									<div class="answer-item">
										<input type="radio" name="q1" title="Marcar como alternativa correta">
										<input type="text" class="answer-input" value="Yuri Alberto"
											placeholder="Texto da alternativa...">
									</div>
								</div>

								<div class="builder-actions">
									<button type="button" class="btn-builder btn-builder-secondary btn-add-answer">
										<i data-lucide="plus"></i> Adicionar Resposta
									</button>
									<button type="button" class="btn-builder btn-builder-primary btn-add-question">
										<i data-lucide="plus-circle"></i> Adicionar Nova Pergunta
									</button>
								</div>
							</div>
						</div>

					</div>
				</div>

				<div class="step-block">
					<div class="step-header">
						<span class="step-number">3</span>
						<h2 class="step-title">Designação e Prazo</h2>
					</div>

					<div class="step3-grid">

						<div class="form-group">
							<label class="form-label">Selecionar Aluno(s) ou Turma</label>
							<input type="text" id="search-student" class="form-input" placeholder="Buscar aluno..."
								style="margin-bottom:8px;">

							<div class="students-list-box">
								<label class="student-item" th:each="aluno : ${alunos}">
									<input type="checkbox" class="chk-student" th:value="${aluno.id}"
										th:checked="${alunoSelecionadoId != null and alunoSelecionadoId == aluno.id}"
										value="">
									<span class="student-name" th:text="${aluno.nome}">Nome do aluno</span>
									<span class="student-team"
										th:if="${turmasPorAluno != null and turmasPorAluno[aluno.id] != null}"
										th:text="${turmasPorAluno[aluno.id]}">Turma</span>
								</label>
								<p class="mef-vazio" th:if="${alunos == null or #lists.isEmpty(alunos)}">Nenhum aluno
									vinculado às suas turmas.</p>
							</div>
						</div>

						<div class="form-group">
							<label class="form-label">Data Limite de Entrega</label>
							<div class="date-picker-box">
								<input type="date" id="task-deadline" class="date-input-styled" value="2026-09-25">
								<span style="font-size:0.75rem; color:#637783;">O prazo será visível na agenda do
									aluno.</span>
							</div>
						</div>

					</div>
				</div>

				<div class="footer-submit-bar">
					<button type="button" class="btn-action btn-draft" id="btn-save-draft">Salvar como Rascunho</button>
					<button type="button" class="btn-action btn-submit" id="btn-submit-task">Enviar Tarefa</button>
				</div>

			</div>
		</main>

	</div>

	<div class="modal-overlay" id="logout-modal">
		<div class="modal-card">
			<h2 class="modal-title">Tem certeza que deseja sair da sua conta?</h2>
			<div class="modal-actions">
				<button class="btn-modal btn-modal-cancel" id="btn-cancel-logout">Cancelar</button>
				<button class="btn-modal btn-modal-logout" id="btn-confirm-logout">Sair</button>
			</div>
		</div>
	</div>


	<script src="/script/dados.js" th:src="@{/script/dados.js}"></script>
	<script src="/script/cruzadas.js" th:src="@{/script/cruzadas.js}"></script>
	<script src="/script/progresso.js" th:src="@{/script/progresso.js}"></script>
	<script src="/script/documentos.js" th:src="@{/script/documentos.js}"></script>
	<script src="/script/cruzadas-navegacao.js" th:src="@{/script/cruzadas-navegacao.js}"></script>
	<script src="/script/recursos.js" th:src="@{/script/recursos.js}"></script>
	<script src="/script/interface-original.js" th:src="@{/script/interface-original.js}"></script>
	<script src="/script/popups.js" th:src="@{/script/popups.js}"></script>
	<script src="/script/convites.js" th:src="@{/script/convites.js}"></script>
	<script src="/script/revisao.js" th:src="@{/script/revisao.js}"></script>
	<script src="/script/escolhas.js" th:src="@{/script/escolhas.js}"></script>
	<script src="/script/mef-criar-tarefa-backend.js" th:src="@{/script/mef-criar-tarefa-backend.js}"></script>
<script defer src="/script/ajustes-front.js" th:src="@{/script/ajustes-front.js}"></script>
</body>

</html>
