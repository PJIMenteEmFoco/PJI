<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Turmas - Mente em Foco</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="../style/global.css" th:href="@{/css/global.css}">
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="../style/turmas-professor.css" th:href="@{/css/turmas-professor.css}">
	<script src="../js/icones.js" th:src="@{/script/icones.js}"></script>
	<link rel="stylesheet" href="../style/recursos.css" th:href="@{/css/recursos.css}">
	<link rel="stylesheet" href="../style/correcoes.css" th:href="@{/css/correcoes.css}">
	<link rel="stylesheet" href="../style/popups.css" th:href="@{/css/popups.css}">
	<link rel="stylesheet" href="../style/revisao.css" th:href="@{/css/revisao.css}">
	<script src="../js/tema.js" th:src="@{/script/tema.js}"></script>
	<link rel="stylesheet" href="../style/escolhas.css" th:href="@{/css/escolhas.css}">
</head>

<body data-original="true" th:attr="data-mef-backend='true'">

	<div class="app-layout">

		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img src="../imagens/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco" class="logo-symbol-only">
				<img src="../imagens/logo_solo.svg" th:src="@{/img/logo_solo.svg}" alt="Mente em Foco" class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
				<i data-lucide="chevron-right"></i>
			</div>

			<nav class="sidebar-nav">
				<a href="dashboard_prof.html" th:href="@{/professor/dashboard}" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a href="tarefas_prof.html" th:href="@{/professor/tarefas}" class="nav-link">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a href="chat_prof.html" th:href="@{/professor/chat}" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="calendario_prof.html" th:href="@{/professor/calendario}" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
				<a href="turmas-prof.html" th:href="@{/professor/turmas}" class="nav-link active">
					<i data-lucide="users"></i>
					<span class="nav-title">Turmas</span>
				</a>
			</nav>

			<div class="sidebar-footer">
				<a href="configuracoes_prof.html" th:href="@{/professor/configuracoes}" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>

		<main class="main-content">
			<div class="page-container">

				<h1 class="page-title">Turmas</h1>

				<div class="toolbar-row">
					<button class="btn-criar-turma" id="btn-open-criar-turma">
						<i data-lucide="plus"></i> Criar turma
					</button>

					<div class="filters-group">
						<div class="search-box">
							<i data-lucide="search" style="width: 16px; height: 16px; color: #8fa5b4;"></i>
							<input type="text" id="input-search-turmas" placeholder="Pesquisar turmas...">
						</div>
						<select class="select-filter" id="select-filter-psico">
							<option value="todos">Todos os Psicopedagogos</option>
							<option value="Lucas Bonetti" th:remove="all">Lucas Bonetti</option>
							<option value="Renata Lima" th:remove="all">Renata Lima</option>
							<option value="Marcos Andrade" th:each="psico : ${psicopedagogos}" th:value="${psico.nome}"
								th:text="${psico.nome}">Marcos Andrade</option>
						</select>
					</div>
				</div>

				<h2 class="section-title">Turmas</h2>

				<div class="turmas-grid" id="turmas-grid">
				</div>

				<!-- Dados do Controller: 'turmas' contém entidades Turma. 'dadosTurmas' é mapa opcional com campos enriquecidos. -->
				<div id="mef-turmas-servidor" hidden>
					<span th:each="turma : ${turmas}"
						th:with="detalhes=${dadosTurmas != null ? dadosTurmas[turma.id] : null}" th:attr="data-id=${turma.id},
                                   data-nome=${turma.nome},
                                   data-prof=${detalhes != null ? detalhes['professorNome'] : (professorLogadoNome != null ? professorLogadoNome : 'Não informado')},
                                   data-psico=${detalhes != null ? detalhes['psicopedagogoNome'] : 'Não informado'},
                                   data-total=${detalhes != null ? detalhes['quantidadeAlunos'] : 0},
                                   data-iniciais=${detalhes != null ? detalhes['iniciaisAlunos'] : ''},
                                   data-url=@{/professor/turmas/{id}(id=${turma.id})}"></span>
				</div>

			</div>
		</main>
	</div>

	<div class="modal-overlay" id="modal-criar-turma">
		<div class="create-turma-outer-card">
			<div class="create-turma-inner-card">

				<div class="modal-header">
					<h3>Criar Nova Turma</h3>
					<p>Preencha as informações necessárias para cadastrar uma nova turma.</p>
				</div>

				<form id="form-criar-turma" method="post" action="/professor/turmas/nova"
					th:action="@{/professor/turmas/nova}">
					<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}">

					<div class="form-group">
						<label for="nome-turma">Nome da Turma</label>
						<input type="text" id="nome-turma" name="nome" class="form-control" placeholder="Ex: Turma 7"
							required>
					</div>

					<div class="form-group">
						<label for="professor-turma">Professor Responsável</label>
						<select id="professor-turma" name="professorId" class="form-control" required>
							<option value="" disabled selected>Selecione o professor</option>
							<option th:if="${professores == null or #lists.isEmpty(professores)}"
								th:value="${professorLogadoId != null ? professorLogadoId : #authentication.principal.id}"
								th:text="${professorLogadoNome != null ? professorLogadoNome : #authentication.principal.primeiroNome}"
								selected>Professor conectado</option>
							<option value="Levi Viana" th:remove="all">Levi Viana</option>
							<option value="Carlos Eduardo" th:remove="all">Carlos Eduardo</option>
							<option value="Fernanda Souza" th:each="professor : ${professores}"
								th:value="${professor.id}" th:text="${professor.nome}">Fernanda Souza</option>
						</select>
					</div>

					<div class="form-group">
						<label for="psicopedagogo-turma">Psicopedagogo Responsável</label>
						<select id="psicopedagogo-turma" name="psicopedagogoId" class="form-control">
							<option value="" disabled selected>Selecione o psicopedagogo</option>
							<option value="Lucas Bonetti" th:remove="all">Lucas Bonetti</option>
							<option value="Renata Lima" th:remove="all">Renata Lima</option>
							<option value="Marcos Andrade" th:each="psico : ${psicopedagogos}" th:value="${psico.id}"
								th:text="${psico.nome}">Marcos Andrade</option>
						</select>
					</div>

					<div class="form-group">
						<label for="desc-turma">Descrição ou Observações (Opcional)</label>
						<textarea id="desc-turma" name="descricao" class="form-control textarea"
							placeholder="Adicione notas adicionais sobre a turma..."></textarea>
					</div>

					<div class="modal-btn-row">
						<button type="button" class="btn-turma-cancel" id="btn-fechar-modal-turma">Cancelar</button>
						<button type="submit" class="btn-turma-save" id="btn-salvar-turma">Salvar Turma</button>
					</div>

				</form>

			</div>
		</div>
	</div>

	<form id="mef-logout-form" method="post" th:action="@{/logout}" action="/logout" hidden>
		<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	</form>

	<div class="modal-overlay" id="logout-modal">
		<div class="modal-card-logout">
			<h3 class="modal-logout-title">Tem certeza que deseja sair da sua conta?</h3>
			<div class="modal-logout-actions">
				<button class="btn-logout-cancel" id="btn-cancel-logout">Cancelar</button>
				<button class="btn-logout-confirm" id="btn-confirm-logout">Sair</button>
			</div>
		</div>
	</div>

	<script>
		(function initTheme() {
			if (localStorage.getItem('theme') === 'escuro') {
				document.body.classList.add('dark-mode');
			}
		})();
		lucide.createIcons();

		const sidebar = document.getElementById('sidebar');
		const toggleBtn = document.getElementById('toggle-btn');
		toggleBtn.addEventListener('click', () => sidebar.classList.toggle('expanded'));

		const turmasPadrao = [
			{id: 1, nome: "Turma 1", prof: "Levi Viana", psico: "Lucas Bonetti"},
			{id: 2, nome: "Turma 2", prof: "Levi Viana", psico: "Lucas Bonetti"},
			{id: 3, nome: "Turma 3", prof: "Levi Viana", psico: "Lucas Bonetti"},
			{id: 4, nome: "Turma 4", prof: "Levi Viana", psico: "Lucas Bonetti"},
			{id: 5, nome: "Turma 5", prof: "Levi Viana", psico: "Lucas Bonetti"},
			{id: 6, nome: "Turma 6", prof: "Levi Viana", psico: "Lucas Bonetti"}
		];

		// Thymeleaf usa dados reais; o arquivo HTML isolado conserva integralmente
		// os dados demonstrativos e o funcionamento do ZIP original.
		const modoServidor = document.body.hasAttribute('data-mef-backend');
		let turmas;
		if (modoServidor) {
			turmas = Array.from(document.querySelectorAll('#mef-turmas-servidor > span'), elemento => ({
				id: elemento.dataset.id,
				nome: elemento.dataset.nome || '',
				prof: elemento.dataset.prof || 'Não informado',
				psico: elemento.dataset.psico || 'Não informado',
				quantidadeAlunos: Number(elemento.dataset.total || 0),
				iniciaisAlunos: (elemento.dataset.iniciais || '').split(',').map(s => s.trim()).filter(Boolean),
				url: elemento.dataset.url
			}));
		} else {
			turmas = JSON.parse(localStorage.getItem('lista_turmas_mef'));
			if (!turmas || turmas.length === 0) {
				turmas = turmasPadrao;
				localStorage.setItem('lista_turmas_mef', JSON.stringify(turmas));
			}
		}

		// Conteúdo vindo do backend não deve ser inserido como HTML sem escape.
		function escaparHTML(texto) {
			return String(texto ?? '').replace(/[&<>"']/g, caractere => ({
				'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
			})[caractere]);
		}

		const turmasGrid = document.getElementById('turmas-grid');
		const searchInput = document.getElementById('input-search-turmas');
		const filterPsico = document.getElementById('select-filter-psico');

		function renderizarTurmas() {
			turmasGrid.innerHTML = '';

			const termoBusca = searchInput.value.toLowerCase().trim();
			const psicoSelecionado = filterPsico.value;

			const turmasFiltradas = turmas.filter(t => {
				const bateNome = t.nome.toLowerCase().includes(termoBusca) || t.prof.toLowerCase().includes(termoBusca);
				const batePsico = (psicoSelecionado === 'todos') || (t.psico === psicoSelecionado);
				return bateNome && batePsico;
			});

			if (turmasFiltradas.length === 0) {
				turmasGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #557D91;">
                        <p style="font-weight: 700; font-size: 1.1rem;">Nenhuma turma encontrada.</p>
                    </div>
                `;
				return;
			}

			turmasFiltradas.forEach(turma => {
				let listaAlunos;
				if (modoServidor) {
					listaAlunos = turma.iniciaisAlunos.map(inicial => ({inicial}));
				} else {
					const alunosStorageKey = `alunos_turma_${turma.nome.replace(/\s+/g, '_')}`;
					listaAlunos = JSON.parse(localStorage.getItem(alunosStorageKey));
					if (!listaAlunos && turma.nome.includes('Turma 2')) {
						listaAlunos = [
							{inicial: "CC"},
							{inicial: "LB"},
							{inicial: "HO"}
						];
					} else if (!listaAlunos) {
						listaAlunos = [];
					}
				}

				const totalAlunos = modoServidor ? turma.quantidadeAlunos : listaAlunos.length;

				let avatarsHTML = '';
				if (totalAlunos === 0) {
					avatarsHTML = `<div class="avatar-circle">--</div>`;
				} else {
					const avataresParaExibir = listaAlunos.slice(0, 3);
					avataresParaExibir.forEach(aluno => {
						const inicial = aluno.inicial || (aluno.nome ? aluno.nome.charAt(0).toUpperCase() : 'AL');
						avatarsHTML += `<div class="avatar-circle">${escaparHTML(inicial)}</div>`;
					});
				}

				const card = document.createElement('div');
				card.className = 'turma-card';

				card.innerHTML = `
                    <h3 class="turma-card-title">${escaparHTML(turma.nome)}</h3>
                    <div class="avatars-and-badge">
                        <div class="avatar-group">${avatarsHTML}</div>
                        <span class="badge-alunos"><i data-lucide="users" style="width:14px; height:14px;"></i> ${totalAlunos} Alunos</span>
                    </div>
                    <div class="turma-info-text">
                        <div>Professor: <strong>${escaparHTML(turma.prof)}</strong></div>
                        <div>Psicopedagogo: <strong>${escaparHTML(turma.psico)}</strong></div>
                    </div>
                `;

                if (modoServidor) {
                    const invite = document.createElement('a');
                    invite.textContent = 'Convidar participantes';
                    invite.href = turma.url;
                    invite.addEventListener('click', event => event.stopPropagation());
                    card.append(invite);
                }
				card.addEventListener('click', () => {
					localStorage.setItem('turmaSelecionadaNome', turma.nome);
					localStorage.setItem('turmaSelecionadaProf', `Prof. ${turma.prof}`);
					localStorage.setItem('turmaSelecionadaPsico', `Psicopedagogo ${turma.psico}`);
					window.location.href = modoServidor ? turma.url : 'detalhes-turma.html';
				});

				turmasGrid.appendChild(card);
			});

			lucide.createIcons();
		}

		renderizarTurmas();

		searchInput.addEventListener('input', renderizarTurmas);
		filterPsico.addEventListener('change', renderizarTurmas);

		const modalCriarTurma = document.getElementById('modal-criar-turma');
		const btnOpenCriarTurma = document.getElementById('btn-open-criar-turma');
		const btnFecharModalTurma = document.getElementById('btn-fechar-modal-turma');
		const formCriarTurma = document.getElementById('form-criar-turma');

		btnOpenCriarTurma.addEventListener('click', () => modalCriarTurma.classList.add('active'));
		btnFecharModalTurma.addEventListener('click', () => {
			modalCriarTurma.classList.remove('active');
			formCriarTurma.reset();
		});

		formCriarTurma.addEventListener('submit', (e) => {
			// No Spring Boot, o formulário faz POST normal com token CSRF.
			// No HTML de demonstração, continua usando o localStorage do ZIP.
			if (modoServidor) return;
			e.preventDefault();

			const nomeTurma = document.getElementById('nome-turma').value.trim();
			const professor = document.getElementById('professor-turma').value;
			const psicopedagogo = document.getElementById('psicopedagogo-turma').value;

			if (!nomeTurma || !professor || !psicopedagogo) return;

			const novaTurma = {
				id: Date.now(),
				nome: nomeTurma,
				prof: professor,
				psico: psicopedagogo
			};

			turmas.push(novaTurma);
			localStorage.setItem('lista_turmas_mef', JSON.stringify(turmas));

			renderizarTurmas();

			formCriarTurma.reset();
			modalCriarTurma.classList.remove('active');
		});

		const logoutModal = document.getElementById('logout-modal');
		document.getElementById('btn-open-logout').addEventListener('click', (e) => {
			e.preventDefault();
			logoutModal.classList.add('active');
		});
		document.getElementById('btn-cancel-logout').addEventListener('click', () => {
			logoutModal.classList.remove('active');
		});
		document.getElementById('btn-confirm-logout').addEventListener('click', () => {
			if (modoServidor) {
				document.getElementById('mef-logout-form').submit();
			} else {
				window.location.href = '../login/login.html';
			}
		});
	</script>
	<script src="../js/dados.js" th:src="@{/script/dados.js}"></script>
	<script src="../js/cruzadas.js" th:src="@{/script/cruzadas.js}"></script>
	<script src="../js/progresso.js" th:src="@{/script/progresso.js}"></script>
	<script src="../js/documentos.js" th:src="@{/script/documentos.js}"></script>
	<script src="../js/cruzadas-navegacao.js" th:src="@{/script/cruzadas-navegacao.js}"></script>
	<script src="../js/recursos.js" th:src="@{/script/recursos.js}"></script>
	<script src="../js/interface-original.js" th:src="@{/script/interface-original.js}"></script>
	<script src="../js/popups.js" th:src="@{/script/popups.js}"></script>
	<script src="../js/revisao.js" th:src="@{/script/revisao.js}"></script>
	<script src="../js/escolhas.js" th:src="@{/script/escolhas.js}"></script>
</body>

</html>
