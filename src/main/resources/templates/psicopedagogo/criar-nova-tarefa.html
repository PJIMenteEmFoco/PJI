<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar Nova Tarefa - Mente em Foco</title>
<link href="/css/criar-nova-tarefa.css" rel="stylesheet" th:href="@{/css/criar-nova-tarefa.css}"/>
<link href="/css/global.css" rel="stylesheet" th:href="@{/css/global.css}"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&amp;family=Montserrat:wght@600;700;800;900&amp;display=swap" rel="stylesheet"/>
<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>
<link href="/css/recursos.css" rel="stylesheet" th:href="@{/css/recursos.css}"/><link href="/css/correcoes.css" rel="stylesheet" th:href="@{/css/correcoes.css}"/><link href="/css/popups.css" rel="stylesheet" th:href="@{/css/popups.css}"/><link href="/css/revisao.css" rel="stylesheet" th:href="@{/css/revisao.css}"/><script src="/script/tema.js" th:src="@{/script/tema.js}"></script><link href="/css/escolhas.css" rel="stylesheet" th:href="@{/css/escolhas.css}"/>
<link href="/css/mef-integracao.css" rel="stylesheet"/><meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_parameter" th:content="${_csrf.parameterName}"/><link rel="stylesheet" href="/css/ajustes-front.css" th:href="@{/css/ajustes-front.css}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
</head>
<body data-mef-profile="psicopedagogo" data-original="true">
<div class="app-layout">
<aside class="sidebar" id="sidebar">
<div class="sidebar-header">
<img alt="Mente em Foco" class="logo-symbol-only" src="/img/logo.png" th:src="@{/img/logo.png}"/>
<img alt="Mente em Foco" class="logo-full-white" src="/img/logo.png" th:src="@{/img/logo.png}"/>
</div>
<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu">
<i data-lucide="chevron-right"></i>
</div>
<nav class="sidebar-nav">
<a class="nav-link active" href="/psicopedagogo/dashboard" th:href="@{/psicopedagogo/dashboard}">
<i data-lucide="home"></i>
<span class="nav-title">Início</span>
</a><a class="nav-link" href="/psicopedagogo/tarefas" th:href="@{/psicopedagogo/tarefas}">
<i data-lucide="book-open"></i>
<span class="nav-title">Atividades</span>
</a>
<a class="nav-link" href="/psicopedagogo/chat" th:href="@{/psicopedagogo/chat}">
<i data-lucide="message-square"></i>
<span class="nav-title">Chat</span>
</a>
<a class="nav-link" href="/psicopedagogo/calendario" th:href="@{/psicopedagogo/calendario}">
<i data-lucide="calendar"></i>
<span class="nav-title">Calendário</span>
</a>
<a class="nav-link" href="/psicopedagogo/turmas" th:href="@{/psicopedagogo/turmas}">
<i data-lucide="users"></i>
<span class="nav-title">Minhas Turmas</span>
</a>
<a class="nav-link" href="/psicopedagogo/notificacoes" th:href="@{/psicopedagogo/notificacoes}" title="Notificações"><i data-lucide="bell"></i><span class="nav-title">Notificações</span></a></nav>
<div class="sidebar-footer">
<a class="nav-link" href="/psicopedagogo/configuracoes" th:href="@{/psicopedagogo/configuracoes}">
<i data-lucide="settings"></i>
<span class="nav-title">Ajustes</span>
</a>
<button class="nav-link" id="btn-open-logout">
<i data-lucide="log-out"></i>
<span class="nav-title">Sair</span>
</button>
</div>
</aside>
<main class="main-content">
<svg class="bg-watermark-book" fill="none" stroke="#557D91" stroke-width="1.2" viewbox="0 0 24 24">
<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
</svg>
<div class="create-task-container">
<div class="page-header">
<a class="btn-back-link" href="/psicopedagogo/tarefas" th:href="@{/psicopedagogo/tarefas}" title="Voltar para Tarefas">
<i data-lucide="arrow-left"></i>
</a>
<div class="page-title-group">
<i data-lucide="book-open"></i>
<h1 class="page-title">Criar Nova Tarefa</h1>
</div>
</div>
<div class="step-block">
<div class="step-header">
<span class="step-number">1</span>
<h2 class="step-title">Título e Instruções</h2>
</div>
<div class="form-group">
<label class="form-label">Título da Tarefa</label>
<input class="form-input" id="task-title" placeholder="Ex: Ortografia e Foco no TDAH" type="text"/>
</div>
<div class="form-group">
<label class="form-label">Instruções da Tarefa (Textos curtos e objetivos)</label>
<textarea class="form-textarea" id="task-instructions" placeholder="Descreva as orientações claras para o aluno..."></textarea>
</div>
</div>
<div class="step-block">
<div class="step-header">
<span class="step-number">2</span>
<h2 class="step-title">Configurar Conteúdo</h2>
</div>
<div class="builder-layout">
<div class="type-selector-card">
<i data-lucide="help-circle"></i>
<span>Quiz Adaptado</span>
</div>
<div id="questions-container" style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
<div class="question-box" data-qindex="1">
<div class="question-header">
<i data-lucide="grip-vertical" style="color:#557D91;"></i>
<input class="question-input" placeholder="Digite a pergunta aqui..." type="text" value="quem jogou mais?"/>
<button class="btn-trash btn-delete-question" title="Excluir Pergunta" type="button"><i data-lucide="trash-2"></i></button>
</div>
<div class="answers-list">
<div class="answer-item">
<input checked="" name="q1" title="Marcar como alternativa correta" type="radio"/>
<input class="answer-input" placeholder="Texto da alternativa..." type="text" value="Ronaldo"/>
</div>
<div class="answer-item">
<input name="q1" title="Marcar como alternativa correta" type="radio"/>
<input class="answer-input" placeholder="Texto da alternativa..." type="text" value="Yuri Alberto"/>
</div>
</div>
<div class="builder-actions">
<button class="btn-builder btn-builder-secondary btn-add-answer" type="button">
<i data-lucide="plus"></i> Adicionar Resposta
                                    </button>
<button class="btn-builder btn-builder-primary btn-add-question" type="button">
<i data-lucide="plus-circle"></i> Adicionar Nova Pergunta
                                    </button>
</div>
</div>
</div>
</div>
</div>
<div class="step-block">
<div class="step-header">
<span class="step-number">3</span>
<h2 class="step-title">Designação e Prazo</h2>
</div>
<div class="step3-grid">
<div class="form-group">
<label class="form-label">Selecionar Aluno(s) ou Turma</label>
<input class="form-input" id="search-student" placeholder="Buscar aluno..." style="margin-bottom:8px;" type="text"/>
<div class="students-list-box"><label class="student-item" th:each="aluno : ${alunos}"><input class="chk-student" disabled="" th:value="${aluno.id}" type="checkbox"/><span class="student-name" th:text="${aluno.nome}">Aluno</span></label><p class="mef-vazio" th:if="${alunos == null or #lists.isEmpty(alunos)}">Sem alunos disponíveis.</p></div>
</div>
<div class="form-group">
<label class="form-label">Data Limite de Entrega</label>
<div class="date-picker-box">
<input class="date-input-styled" id="task-deadline" type="date" value="2026-09-25"/>
<span style="font-size:0.75rem; color:#637783;">O prazo será visível na agenda do aluno.</span>
</div>
</div>
</div>
</div>
<div class="footer-submit-bar">
<button class="btn-action btn-draft" disabled="disabled" id="btn-save-draft" title="A gravação destas atividades ainda não tem endpoint compatível no backend" type="button">Salvar como Rascunho</button>
<button class="btn-action btn-submit" disabled="disabled" id="btn-submit-task" title="A gravação destas atividades ainda não tem endpoint compatível no backend" type="button">Enviar Tarefa</button>
</div>
</div>
</main>
</div>
<div class="modal-overlay" id="logout-modal">
<div class="modal-card">
<h2 class="modal-title">Tem certeza que deseja sair da sua conta?</h2>
<div class="modal-actions">
<button class="btn-modal btn-modal-cancel" id="btn-cancel-logout">Cancelar</button>
<button class="btn-modal btn-modal-logout" id="btn-confirm-logout" type="button">Sair</button>
</div>
</div>
</div>
<script defer="defer" src="/script/mef-comum.js"></script><script defer src="/script/ajustes-front.js" th:src="@{/script/ajustes-front.js}"></script>
</body>
</html>
