<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mente em Foco - Notificações</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
	<link rel="stylesheet" href="/css/detalhes-turma.css" th:href="@{/css/detalhes-turma.css}">
	<link rel="stylesheet" href="/css/recursos.css" th:href="@{/css/recursos.css}">
	<link rel="stylesheet" href="/css/correcoes.css" th:href="@{/css/correcoes.css}">
	<link rel="stylesheet" href="/css/popups.css" th:href="@{/css/popups.css}">
	<link rel="stylesheet" href="/css/revisao.css" th:href="@{/css/revisao.css}">
	<link rel="stylesheet" href="/css/escolhas.css" th:href="@{/css/escolhas.css}">

	<script src="/script/icones.js" th:src="@{/script/icones.js}"></script>
	<script src="/script/tema.js" th:src="@{/script/tema.js}"></script>
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body data-page="notificacoes">
	<div class="app-layout">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header">
				<img src="/img/logo_em_pe.svg" th:src="@{/img/logo_em_pe.svg}" alt="Mente em Foco"
					class="logo-symbol-only">
				<img src="/img/logo_em_pe.svg" th:src="@{/img/logo_em_pe.svg}" alt="Mente em Foco"
					class="logo-full-white">
			</div>

			<div class="sidebar-toggle-badge" id="toggle-btn" title="Expandir/Recolher Menu" role="button" tabindex="0"
				aria-label="Expandir ou recolher menu">
				<i data-lucide="chevron-right"></i>
			</div>

			<nav class="sidebar-nav" aria-label="Navegação principal">
				<a href="/psicopedagogo/dashboard" th:href="@{/psicopedagogo/dashboard}" class="nav-link">
					<i data-lucide="home"></i>
					<span class="nav-title">Início</span>
				</a>
				<a href="/psicopedagogo/tarefas" th:href="@{/psicopedagogo/tarefas}" class="nav-link">
					<i data-lucide="book-open"></i>
					<span class="nav-title">Atividades</span>
				</a>
				<a href="/psicopedagogo/chat" th:href="@{/psicopedagogo/chat}" class="nav-link">
					<i data-lucide="message-square"></i>
					<span class="nav-title">Chat</span>
				</a>
				<a href="/psicopedagogo/calendario" th:href="@{/psicopedagogo/calendario}" class="nav-link">
					<i data-lucide="calendar"></i>
					<span class="nav-title">Calendário</span>
				</a>
				<a href="/psicopedagogo/turmas" th:href="@{/psicopedagogo/turmas}" class="nav-link">
					<i data-lucide="users"></i>
					<span class="nav-title">Minhas Turmas</span>
				</a>
				<a href="/psicopedagogo/notificacoes" th:href="@{/psicopedagogo/notificacoes}" class="nav-link active"
					aria-current="page" title="Notificações">
					<i data-lucide="bell"></i>
					<span class="nav-title">Notificações</span>
				</a>
			</nav>

			<div class="sidebar-footer">
				<a href="/psicopedagogo/configuracoes" th:href="@{/psicopedagogo/configuracoes}" class="nav-link">
					<i data-lucide="settings"></i>
					<span class="nav-title">Ajustes</span>
				</a>
				<button class="nav-link" id="btn-open-logout" type="button">
					<i data-lucide="log-out"></i>
					<span class="nav-title">Sair</span>
				</button>
			</div>
		</aside>

		<main class="main-content">
			<div id="mef-root" class="mef-page" aria-live="polite"></div>
		</main>
	</div>

	<!-- Usa o script compartilhado da integração de notificações já instalada para aluno e professor. -->
	<script defer src="/script/mef-notificacoes-backend.js" th:src="@{/script/mef-notificacoes-backend.js}"></script>
</body>

</html>
