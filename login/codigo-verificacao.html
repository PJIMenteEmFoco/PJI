<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código de verificação - Mente em Foco</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../style/style.css" />
</head>
<body>

  <div class="toast-notification" id="toast">
    <span id="toast-message">Código validado com sucesso!</span>
    <button class="toast-close-btn" onclick="hideToast()" aria-label="Fechar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </button>
  </div>

  <div class="top-logo">
    <img src="../imagens/Captura de tela 2026-09-06 145230.png" alt="Mente em Foco" />
  </div>

  <main class="verify-container">
    <h1 class="verify-title">Digite o código enviado para o seu e-mail</h1>
    <p class="verify-subtitle">Enviamos um código de 6 dígitos para o seu endereço cadastrado.</p>

    <form class="verify-form" onsubmit="validarCodigo(event)">
      <div class="otp-inputs">
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" autofocus required />
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
        <input type="text" class="otp-box" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
      </div>

      <button type="submit" class="btn btn-secondary">Verificar Código</button>
      <a href="#" class="form-link" onclick="reenviarCodigo(event)">Não recebeu o código? Clique para reenviar</a>
    </form>
  </main>

  <script>
    
    const otpBoxes = document.querySelectorAll('.otp-box');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    let toastTimeout;

    otpBoxes.forEach((box, index) => {
      box.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpBoxes.length - 1) {
          otpBoxes[index + 1].focus();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpBoxes[index - 1].focus();
        }
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').trim().slice(0, otpBoxes.length);
        if (/^\d+$/.test(pastedData)) {
          pastedData.split('').forEach((char, i) => {
            if (otpBoxes[i]) otpBoxes[i].value = char;
          });
          if (otpBoxes[pastedData.length - 1]) {
            otpBoxes[pastedData.length - 1].focus();
          }
        }
      });
    });

    function showToast(message, redirect = false) {
      toastMessage.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        hideToast();
        if (redirect) {
          window.location.href = '../login.html';
        }
      }, 3000);
    }

    function hideToast() {
      toast.classList.remove('show');
    }

    function validarCodigo(event) {
      event.preventDefault();
      let code = '';
      otpBoxes.forEach(box => code += box.value);

      if (code.length < 6) {
        showToast('Por favor, preencha todos os 6 dígitos do código.');
        return;
      }

      showToast('Código verificado com sucesso!', true);
    }

    function reenviarCodigo(event) {
      event.preventDefault();
      showToast('Um novo código foi enviado para o seu e-mail.');
    }
  </script>
</body>
</html>
