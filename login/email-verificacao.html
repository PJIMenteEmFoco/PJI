<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email de verificação - Mente em Foco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css" />
</head>
<body>

  <div class="toast-notification" id="toast">
    <span id="toast-message">Código enviado com sucesso!</span>
    <button class="toast-close-btn" onclick="hideToast()" aria-label="Fechar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </button>
  </div>

  <div class="top-logo">
    <img src="../imagens/Captura de tela 2026-09-06 145230.png" alt="Mente em Foco" />
  </div>

  <main class="verify-container">
    <h1 class="verify-title">
      Digite um e-mail para enviarmos um código de validação para você
    </h1>

    <form class="verify-form" onsubmit="enviarCodigo(event)">
      <div class="form-group">
        <label for="recoveryEmail">Email de recuperação</label>
        <input 
          type="email" 
          id="recoveryEmail" 
          class="form-control" 
          autocomplete="off" 
          required 
        />
      </div>
      <button type="submit" class="btn btn-secondary">Enviar E-mail</button>
      <a href="../login/login.html" class="form-link">Lembrou a senha? Clique aqui para entrar!</a>
    </form>
  </main>

  <script>
    
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    let toastTimeout;

    function showToast(message, redirect = false) {
      toastMessage.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        hideToast();
        if (redirect) {
          window.location.href = 'codigo-verificacao.html';
        }
      }, 2000);
    }

    function hideToast() {
      toast.classList.remove('show');
    }

    function enviarCodigo(event) {
      event.preventDefault();
      const email = document.getElementById('recoveryEmail').value.trim();

      if (email) {
        showToast('Código enviado para ' + email + '!', true);
      }
    }
  </script>
</body>
</html>
